version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - gocritic
    - errorlint
    - bodyclose
    - noctx
    - depguard
  settings:
    errcheck:
      # Writes to the user's terminal; failures are not actionable.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    depguard:
      rules:
        # core must never talk to external tools directly; only adapters
        # (and the launcher, which exists to spawn the child) may.
        core-no-exec:
          files:
            - "**/internal/core/**"
          deny:
            - pkg: os/exec
              desc: "core depends on ports; only internal/adapters may use os/exec"
        cli-no-exec:
          files:
            - "**/internal/cli/**"
          deny:
            - pkg: os/exec
              desc: "cli is thin; only internal/adapters may use os/exec"
